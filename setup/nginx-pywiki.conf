# -----------------------------------------------------------------------------
# nginx reverse-proxy config for pywiki.example.com
#
# PyWiki  →  https://pywiki.example.com  →  127.0.0.1:8222
#
# Before installing, replace pywiki.example.com with your own domain.
#
# The upstream port must equal APP_PORT in /opt/pywiki/.env.
# Convention: 8 + the instance IP's last octet, zero-padded (10.0.0.222 -> 8222).
#
# TLS certificates are your responsibility; see "TLS certificate" in
# setup/README.md.  Pick ONE of the certificate options below.
#
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/.
# -----------------------------------------------------------------------------

# ── HTTPS ─────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pywiki.example.com;

    # ── Certificate: option A (default) - Let's Encrypt via certbot ───────────
    ssl_certificate     /etc/letsencrypt/live/pywiki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pywiki.example.com/privkey.pem;

    # ── Certificate: option B - your own certificate ─────────────────────────
    # e.g. a wildcard *.example.com certificate from a commercial CA.
    # Comment out option A and point these at your full chain and key.
    # ssl_certificate     /etc/ssl/certs/example.com/fullchain.crt;
    # ssl_certificate_key /etc/ssl/private/example.com/privkey.key;

    # TLS settings (independent of where the certificate came from)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin"  always;

    # Static files served directly by nginx for performance
    location /static/ {
        alias /opt/pywiki/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else proxied to uvicorn
    location / {
        proxy_pass         http://127.0.0.1:8222;   # = APP_PORT
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Allow large file uploads (attachments up to 55 MB)
        client_max_body_size 55M;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name pywiki.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
